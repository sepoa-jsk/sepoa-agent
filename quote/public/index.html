<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세포아 견적 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css" />
  <!-- tokens → base → components. app.css 는 작업 7 에서 흡수·제거됨. -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- 로그인 게이트 -->
  <div id="login-gate" class="login-gate hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">SQ</div>
        <h1>세포아 견적 시스템</h1>
        <p>SingleSuite 견적서 자동생성</p>
      </div>
      <div id="login-google" class="hidden">
        <div id="google-btn"></div>
        <p class="login-hint">회사 Google 계정으로 로그인하세요.</p>
      </div>
      <form id="login-dev" class="login-dev hidden">
        <label>개발용 로그인 (AUTH_MODE=dev)</label>
        <input type="email" id="dev-email" placeholder="you@sepoa.co.kr" required />
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
        <p class="login-hint">개발 모드입니다. 이메일만으로 로그인됩니다.</p>
      </form>
      <div id="login-error" class="login-error hidden"></div>
    </div>
  </div>

  <!-- 앱 셸 -->
  <div id="app-shell" class="app hidden">
    <aside class="side">
      <div class="brand">
        <div class="logo">S</div><span>SingleSuite</span>
      </div>
      <nav><!-- layout/sidebar.js 가 채운다 --></nav>
      <div class="side-foot">
        <div class="side-user">
          <div class="side-name" id="user-name"></div>
          <div class="side-role" id="user-role"></div>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-sm btn-block">로그아웃</button>
      </div>
    </aside>
    <main class="main">
      <header class="gnb">
        <h1 id="gnb-title"></h1>
        <span class="path" id="gnb-path"></span>
        <span class="sp"></span>
        <span class="gnb-actions" id="gnb-actions"></span>
        <span class="user">
          <span id="gnb-username"></span>
          <span class="avatar" id="gnb-avatar"></span>
        </span>
      </header>
      <div class="content">
        <div id="view" class="view"></div>
      </div>
    </main>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
