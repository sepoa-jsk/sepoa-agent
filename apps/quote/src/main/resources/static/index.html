<!DOCTYPE html>
<html lang="ko" data-ss-theme="legacy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세포아 견적 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" />
  <!-- tokens → base → components : 아직 SingleSuite 로 바꾸지 않은 화면용.
       ss-base(스킬 원본) → ss-app(앱 셸 보탬) 을 뒤에 두어 셸·전환한 화면은 이쪽이 이긴다. -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/ss-base.css" />
  <link rel="stylesheet" href="css/ss-app.css" />
</head>
<body>
  <!-- 로그인 게이트 -->
  <div id="login-gate" class="login-gate hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">SQ</div>
        <h1>세포아 견적 시스템</h1>
        <p>SingleSuite 견적서 자동생성</p>
      </div>
      <div id="login-google" class="hidden">
        <div id="google-btn"></div>
        <p class="login-hint">회사 Google 계정으로 로그인하세요.</p>
      </div>
      <form id="login-dev" class="login-dev hidden">
        <label>개발용 로그인 (AUTH_MODE=dev)</label>
        <input type="email" id="dev-email" placeholder="you@sepoa.co.kr" required />
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
        <p class="login-hint">개발 모드입니다. 이메일만으로 로그인됩니다.</p>
      </form>
      <div id="login-error" class="login-error hidden"></div>
    </div>
  </div>

  <!-- 앱 셸 — SingleSuite: GNB → 화면 제목 바 → 본문 → 하단 화면 탭바 -->
  <div id="app-shell" class="ss-app hidden">
    <header class="ss-gnb">
      <span class="ss-gnb__logo" id="gnb-home-logo">SepoaSoft Single Suite</span>
      <a class="ss-gnb__home" id="gnb-home" href="#/quotes" title="홈"><svg class="ss-gnb__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
      <svg class="ss-gnb__icon" id="gnb-menu-btn" role="button" aria-label="전체 메뉴" aria-expanded="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      <span class="ss-gnb__spacer"></span>
      <div class="ss-gnb__right">
        <span>English</span>
        <svg class="ss-gnb__icon ss-gnb__icon--sm" id="gnb-help" role="button" aria-label="도움말" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        <span id="gnb-username"></span>
        <svg class="ss-gnb__icon ss-gnb__icon--sm" id="logout-btn" role="button" aria-label="로그아웃" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>로그아웃</title><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
      </div>
      <nav class="ss-menu" id="gnb-menu" hidden><!-- layout/sidebar.js 가 채운다 --></nav>
    </header>

    <div class="ss-title" id="page-title"></div>

    <div class="ss-main">
      <div class="ss-body">
        <div class="ss-pageactions" id="page-actions" hidden></div>
        <div id="view" class="ss-view"></div>
      </div>
    </div>

    <nav class="ss-tabbar" id="tabbar"><!-- layout/tabbar.js 가 채운다 --></nav>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
